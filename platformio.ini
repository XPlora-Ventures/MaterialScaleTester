; PlatformIO Project Configuration File

[platformio]
build_dir    = C:\.pio_local\MaterialScaleTester\build
libdeps_dir  = C:\.pio_local\MaterialScaleTester\libdeps

[env:main]
platform      = espressif32@6.9.0
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7
    adafruit/Adafruit MAX31865 library @ ^1.6
    adafruit/Adafruit BusIO @ ^1.14
